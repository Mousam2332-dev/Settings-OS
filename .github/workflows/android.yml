import android.content.Intent
import android.os.Bundle
import android.provider.Settings
import android.widget.LinearLayout
import android.widget.Switch
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        val devModeSwitch = findViewById<Switch>(R.id.switch_dev_mode)
        val systemConnectBtn = findViewById<LinearLayout>(R.id.btn_system_connect)

        // When the switch is flipped, open the Android Developer Options screen
        devModeSwitch.setOnCheckedChangeListener { _, _ ->
            try {
                val intent = Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS)
                startActivity(intent)
            } catch (e: Exception) {
                e.printStackTrace()
            }
        }

        // When the System Connect button is tapped, open the main Android Settings
        systemConnectBtn.setOnClickListener {
            try {
                val intent = Intent(Settings.ACTION_SETTINGS)
                startActivity(intent)
            } catch (e: Exception) {
                e.printStackTrace()
            }
        }
    }
}
